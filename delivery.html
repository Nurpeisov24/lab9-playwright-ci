<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор доставки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      padding: 40px;
    }
    .container {
      max-width: 450px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0002;
    }
    h1 { text-align: center; }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Расчёт доставки</h1>

  <label for="amount">Сумма заказа (₸)</label>
  <input
    type="number"
    id="amount"
    min="0"
    placeholder="Введите сумму"
  >

  <label for="delivery">Тип доставки</label>
  <select id="delivery">
    <option value="city">По городу</option>
    <option value="region">По региону</option>
  </select>

  <button id="calculate" onclick="calculateDelivery()">
    Рассчитать
  </button>

  <div id="result"></div>
</div>

<script>
function calculateDelivery() {
  const value = Number(
    document.getElementById("amount").value
  );

  const delivery = document.getElementById("delivery").value;
  const result = document.getElementById("result");

  if (
    document.getElementById("amount").value === "" ||
    value < 0
  ) {
    result.textContent = "Введите корректную сумму заказа";
    return;
  }

  let deliveryPrice = 0;

  if (value >= 10000) {
    deliveryPrice = 0;
  } else if (delivery === "city") {
    deliveryPrice = 1000;
  } else if (delivery === "region") {
    deliveryPrice = 2000;
  }

  const total = value + deliveryPrice;

  result.textContent =
    "Стоимость доставки: " + deliveryPrice + " ₸. " +
    "Итого: " + total + " ₸";
}
</script>

</body>
</html>
